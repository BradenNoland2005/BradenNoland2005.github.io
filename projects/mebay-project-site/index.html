<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mebay Product Site</title>
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
         <!--FLEXBOX ITEM-->
        <div id="layout">
            <!--FLEXBOX ITEM-->
            <div id="thumbnail-colum">
                <img src="images/sonic-front.jpg"
                alt="sonic-front"
                width="100"
                >
                <img src="images/sonic-back.jpg"
                alt="sonic-back"
                width="100"
                height="200"
                >
                <img src="images/sonic-side.jpg"
                alt="sonic-side"
                width="100"
                >

            </div>
           <!--FLEXBOX ITEM-->
            <div id="featured-image-colum">
                <img src="images/sonic-front.jpg"
                alt="sonic-product"
                width="500"
                >


            </div>
           <!--FLEXBOX ITEM-->
            <div id="product-info-colum">
                <p class="head1">
                    Sonic The Hedgehog - Plush 12" H
                </p>
                <br>
                <p class="user">
                    Offical Sega Store (10)
                </p>
                <p class="info">
                   87% Positive(173 Reviews) 
                   More Sega Items 
                   Email Sega
                </p>
                <br>
                <p class="price">
                    US 24.99
                </p>
                <p>
                    Condition: NEW
                </p>
                <br>
                <p class="button">
                    <a class="click1">Buy Now</a>
                </p>
                <p class="button">
                    <a class="click2">Add To Cart </a>
                </p>
                <p class="button">
                    <a class="click3">Add To Wishlist</a>
                </p>
            </div>
        </div>
        
    </body>
</html>
